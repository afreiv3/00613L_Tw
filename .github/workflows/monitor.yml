name: 00631L Monitor

on:
  schedule:
    # 注意：cron 用 UTC。台股 09:00–13:30 = UTC 01:00–05:30。
    # 刻意避開壅塞的整點/半點(:00/:30)，改用 :08/:23/:38/:53 每15分一次，
    # 增加冗餘——GitHub 排程常在尖峰被延遲或丟棄，多打幾次提高命中率。
    - cron: "8,23,38,53 1-5 * * 1-5"
  workflow_dispatch: {}   # 允許手動觸發（測試用）
  repository_dispatch:     # Telegram /refresh 經 Vercel 函式觸發重算
    types: [manual_refresh]

permissions:
  contents: write          # 需要把 state.json / dashboard_data.json / archive 寫回 repo

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python monitor.py

      - name: Persist data
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"

          # 重要：這裡絕對不能用 `|| true` 蓋過失敗。
          # 2026-07-20 曾發生併發執行造成 rebase 衝突、留下未解決的 <<<<<<< 標記，
          # 舊版用 `|| true` 吞掉失敗、照樣把壞掉的 JSON commit+push 上去；
          # 下一輪 tick 讀檔解析失敗，三套模擬盤的 load_state() 又靜默回退成全新初始值，
          # 導致 paper_state*.json 的歷史損益/交易次數被永久覆蓋成 100 萬本金、0 筆交易
          # （已於 2026-07-24 修復並還原資料，見該次 commit）。
          # 現在：失敗就整輪中止、不提交任何資料，寧可丟掉這一次 15 分鐘的 tick。
          if ! git pull --rebase --autostash; then
            echo "::error::git pull --rebase 失敗（可能有衝突）。中止本輪，不提交任何資料。"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi

          # 只加「存在的」資料檔（沒成交時 paper_trades*.json 可能尚未產生）
          for f in state.json dashboard_data.json dashboard_data_gemini.json \
                   dashboard_data_chatgpt.json dashboard_data_claude.json \
                   paper_state.json paper_trades.json \
                   paper_state_gemini.json paper_trades_gemini.json \
                   paper_state_chatgpt.json paper_trades_chatgpt.json \
                   paper_state_claude.json paper_trades_claude.json \
                   archive_quant_*.json archive_gemini_*.json archive_chatgpt_*.json \
                   archive_claude_*.json; do
            [ -e "$f" ] && git add "$f" || true
          done

          if git diff --cached --quiet; then
            echo "無變更"
            exit 0
          fi

          # 最後一道防線：commit 前掃描暫存區檔案，若混入未解決的 git 衝突標記
          # （代表 rebase/autostash 過程仍有問題），寧可整輪失敗，也不能發布壞資料。
          conflict_files=""
          for f in $(git diff --cached --name-only); do
            if [ -f "$f" ] && grep -lE '^(<{7}|={7}|>{7})( |$)' "$f" >/dev/null 2>&1; then
              conflict_files="$conflict_files $f"
            fi
          done
          if [ -n "$conflict_files" ]; then
            echo "::error::偵測到未解決的 git 衝突標記，拒絕提交！可疑檔案：$conflict_files"
            git reset
            exit 1
          fi

          git commit -m "update data $(date -u +%FT%TZ) [skip ci]"
          git push
