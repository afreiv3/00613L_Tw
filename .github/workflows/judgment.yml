name: 00631L LLM 判讀

on:
  schedule:
    # 台北盤後 13:40 = UTC 05:40；盤前 08:40 = UTC 00:40。週一至週五。
    - cron: '40 5 * * 1-5'
    - cron: '40 0 * * 1-5'
  workflow_dispatch: {}
  repository_dispatch:
    types: [manual_refresh]   # 讓 Telegram /refresh 也能觸發

permissions:
  contents: write             # 寫回 judgment_log.json

concurrency:
  group: judgment
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install anthropic

      - name: Generate judgment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MODEL: claude-sonnet-4-6     # 可改 claude-opus-4-6
        run: python generate_judgment.py

      - name: Persist judgment_log.json
        run: |
          if [ -n "$(git status --porcelain judgment_log.json)" ]; then
            git config user.name "judge-bot"
            git config user.email "judge-bot@users.noreply.github.com"
            git pull --rebase --autostash || true
            git add judgment_log.json
            git commit -m "judgment $(date -u +%FT%TZ) [skip ci]"
            git push
          else
            echo "無變更"
          fi
